<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33373b"/>
      <stop offset="0.5" stop-color="#2b2e32"/>
      <stop offset="1" stop-color="#232628"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floor shadow, split under each foot -->
  <ellipse cx="72" cy="348" rx="50" ry="9" fill="url(#shadow)"/>
  <ellipse cx="168" cy="348" rx="50" ry="9" fill="url(#shadow)"/>

  <!-- torso -->
  <rect x="25" y="8" width="190" height="258" rx="3" fill="url(#panel)" stroke="#151719" stroke-width="2"/>
  <rect x="25" y="8" width="190" height="258" rx="3" fill="url(#edge)"/>

  <!-- column separators (4 columns) -->
  <line x1="72.5" y1="10" x2="72.5" y2="264" stroke="#141618" stroke-width="3"/>
  <line x1="120" y1="10" x2="120" y2="264" stroke="#141618" stroke-width="3"/>
  <line x1="167.5" y1="10" x2="167.5" y2="264" stroke="#141618" stroke-width="3"/>
  <line x1="74" y1="10" x2="74" y2="264" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="121.5" y1="10" x2="121.5" y2="264" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <line x1="169" y1="10" x2="169" y2="264" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- articulation joints -->
  <rect x="27" y="118" width="186" height="8" fill="#101214"/>
  <rect x="27" y="122" width="186" height="1.5" fill="#3d4145"/>
  <rect x="27" y="232" width="186" height="8" fill="#101214"/>
  <rect x="27" y="236" width="186" height="1.5" fill="#3d4145"/>

  <!-- left screen -->
  <rect x="82" y="34" width="30" height="64" rx="1.5" fill="#04070a" stroke="#0c0e10" stroke-width="1.5"/>
  <g fill="#5eead4">
    <rect x="86" y="40" width="22" height="2.4" opacity="0.9"/>
    <rect x="86" y="46" width="14" height="2.4" opacity="0.55"/>
    <rect x="86" y="52" width="19" height="2.4" opacity="0.75"/>
    <rect x="86" y="58" width="9"  height="2.4" opacity="0.45"/>
    <rect x="86" y="64" width="21" height="2.4" opacity="0.8"/>
    <rect x="86" y="70" width="12" height="2.4" opacity="0.5"/>
    <rect x="86" y="76" width="17" height="2.4" opacity="0.7"/>
    <rect x="86" y="82" width="7"  height="2.4" opacity="0.4"/>
  </g>
  <rect x="82" y="88" width="30" height="2" fill="#5eead4" opacity="0.25"/>

  <!-- right screen -->
  <rect x="128" y="34" width="30" height="64" rx="1.5" fill="#04070a" stroke="#0c0e10" stroke-width="1.5"/>
  <g fill="#5eead4">
    <rect x="132" y="76" width="3.4" height="14" opacity="0.9"/>
    <rect x="137" y="66" width="3.4" height="24" opacity="0.7"/>
    <rect x="142" y="56" width="3.4" height="34" opacity="0.95"/>
    <rect x="147" y="46" width="3.4" height="44" opacity="0.6"/>
    <rect x="152" y="60" width="3.4" height="30" opacity="0.8"/>
  </g>
  <rect x="132" y="40" width="22" height="2.4" fill="#5eead4" opacity="0.5"/>
  <rect x="128" y="88" width="30" height="2" fill="#5eead4" opacity="0.25"/>

  <!-- outer column vents, upper section -->
  <g stroke="#191c1e" stroke-width="2.5">
    <line x1="36" y1="48" x2="62" y2="48"/>
    <line x1="36" y1="58" x2="62" y2="58"/>
    <line x1="36" y1="68" x2="62" y2="68"/>
    <line x1="36" y1="78" x2="62" y2="78"/>
    <line x1="178" y1="48" x2="204" y2="48"/>
    <line x1="178" y1="58" x2="204" y2="58"/>
    <line x1="178" y1="68" x2="204" y2="68"/>
    <line x1="178" y1="78" x2="204" y2="78"/>
  </g>

  <!-- mid section seams -->
  <g stroke="#1d2023" stroke-width="2">
    <line x1="30" y1="160" x2="210" y2="160"/>
    <line x1="30" y1="196" x2="210" y2="196"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="30" y1="162" x2="210" y2="162"/>
    <line x1="30" y1="198" x2="210" y2="198"/>
  </g>

  <!-- hip joint: where the torso ends and the legs begin -->
  <rect x="27" y="266" width="186" height="8" fill="#101214"/>
  <rect x="27" y="270" width="186" height="1.5" fill="#3d4145"/>

  <!-- left leg -->
  <rect x="32" y="274" width="80" height="56" fill="url(#panel)" stroke="#151719" stroke-width="2"/>
  <rect x="32" y="274" width="80" height="56" fill="url(#edge)"/>
  <line x1="72" y1="280" x2="72" y2="326" stroke="#101214" stroke-width="3"/>
  <line x1="73.5" y1="280" x2="73.5" y2="326" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <rect x="29" y="330" width="86" height="12" rx="3" fill="#191b1d" stroke="#0e0f11" stroke-width="1.5"/>
  <rect x="45" y="332" width="8" height="6" rx="1" fill="#101214"/>

  <!-- right leg -->
  <rect x="128" y="274" width="80" height="56" fill="url(#panel)" stroke="#151719" stroke-width="2"/>
  <rect x="128" y="274" width="80" height="56" fill="url(#edge)"/>
  <line x1="168" y1="280" x2="168" y2="326" stroke="#101214" stroke-width="3"/>
  <line x1="169.5" y1="280" x2="169.5" y2="326" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <rect x="125" y="330" width="86" height="12" rx="3" fill="#191b1d" stroke="#0e0f11" stroke-width="1.5"/>
  <rect x="187" y="332" width="8" height="6" rx="1" fill="#101214"/>
</svg>
