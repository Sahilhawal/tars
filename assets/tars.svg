<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" width="280" height="360">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9198a1"/>
      <stop offset="0.12" stop-color="#757b83"/>
      <stop offset="1" stop-color="#4a4e54"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bff5ff"/>
      <stop offset="1" stop-color="#4fd3ea"/>
    </radialGradient>
  </defs>

  <ellipse cx="140" cy="345" rx="115" ry="10" fill="url(#shadow)"/>

  <!-- Block B: back, left-center, mostly hidden -->
  <g transform="rotate(-2 84 180)">
    <rect x="60" y="55" width="48" height="250" rx="2" fill="url(#face)" stroke="#0d0e10" stroke-width="3"/>
    <g stroke="#24262a" stroke-width="2" opacity="0.5">
      <line x1="76" y1="60" x2="76" y2="300"/>
      <line x1="92" y1="60" x2="92" y2="300"/>
    </g>
  </g>

  <!-- Block A: left, front -->
  <g transform="rotate(-4 44 212)">
    <rect x="18" y="90" width="52" height="245" rx="2" fill="url(#face)" stroke="#0d0e10" stroke-width="3"/>
    <g stroke="#24262a" stroke-width="2" opacity="0.5">
      <line x1="34" y1="95" x2="34" y2="330"/>
      <line x1="52" y1="95" x2="52" y2="330"/>
    </g>
    <!-- belt band -->
    <rect x="18" y="255" width="52" height="16" fill="#6b7480" stroke="#0d0e10" stroke-width="2"/>
  </g>

  <!-- Block D: right, front -->
  <g transform="rotate(3 176 207)">
    <rect x="150" y="85" width="52" height="245" rx="2" fill="url(#face)" stroke="#0d0e10" stroke-width="3"/>
    <g stroke="#24262a" stroke-width="2" opacity="0.5">
      <line x1="166" y1="90" x2="166" y2="325"/>
      <line x1="184" y1="90" x2="184" y2="325"/>
    </g>
  </g>

  <!-- Block C: center, tallest, front-most — the hero block -->
  <g transform="rotate(-1 126 180)">
    <rect x="95" y="22" width="62" height="316" rx="2" fill="url(#face)" stroke="#0d0e10" stroke-width="3"/>
    <g stroke="#24262a" stroke-width="2" opacity="0.45">
      <line x1="113" y1="165" x2="113" y2="335"/>
      <line x1="140" y1="165" x2="140" y2="335"/>
    </g>

    <!-- screen -->
    <rect x="103" y="66" width="46" height="88" rx="4" fill="#101a2c" stroke="#080c14" stroke-width="2"/>
    <circle cx="139" cy="79" r="4" fill="url(#eye)"/>
    <g fill="#8fe3f0">
      <rect x="109" y="92" width="16" height="3" opacity="0.9"/>
      <rect x="109" y="99" width="10" height="3" opacity="0.55"/>
      <rect x="109" y="106" width="14" height="3" opacity="0.75"/>
      <rect x="109" y="113" width="7"  height="3" opacity="0.45"/>
      <rect x="132" y="99" width="10" height="3" opacity="0.8"/>
      <rect x="132" y="106" width="6"  height="3" opacity="0.5"/>
      <rect x="132" y="113" width="12" height="3" opacity="0.7"/>
      <rect x="109" y="122" width="12" height="3" opacity="0.6"/>
      <rect x="132" y="122" width="8"  height="3" opacity="0.65"/>
      <rect x="109" y="131" width="9"  height="3" opacity="0.5"/>
      <rect x="132" y="131" width="11" height="3" opacity="0.55"/>
      <rect x="109" y="140" width="15" height="3" opacity="0.8"/>
    </g>

    <!-- TARS label + dotted status column -->
    <text x="118" y="250" fill="#e8842a" font-family="ui-monospace, 'Courier New', monospace"
          font-size="15" font-weight="700" letter-spacing="3"
          transform="rotate(-90 118 250)">TARS</text>
    <g fill="#9aa0a8">
      <circle cx="140" cy="200" r="1.6"/>
      <circle cx="140" cy="208" r="1.6"/>
      <circle cx="140" cy="216" r="1.6"/>
      <circle cx="140" cy="228" r="1.6"/>
      <circle cx="140" cy="236" r="1.6"/>
    </g>
  </g>
</svg>
