<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" width="240" height="360">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c7a54"/>
      <stop offset="0.48" stop-color="#7a5c3d"/>
      <stop offset="0.52" stop-color="#5c4530"/>
      <stop offset="1" stop-color="#3c2d20"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.15" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="120" cy="350" rx="90" ry="10" fill="url(#shadow)"/>

  <!-- body: tall block, legs flaring at the base -->
  <path d="M85,20 L155,20 L155,286 L177,340 L177,348 L63,348 L63,340 L85,286 Z"
        fill="url(#metal)" stroke="#241a12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M85,20 L155,20 L155,286 L177,340 L177,348 L63,348 L63,340 L85,286 Z"
        fill="url(#sheen)"/>

  <!-- horizontal panel seams -->
  <g stroke="#241a12" stroke-width="2" opacity="0.85">
    <line x1="67" y1="72" x2="173" y2="72"/>
    <line x1="66" y1="150" x2="174" y2="150"/>
    <line x1="65" y1="222" x2="175" y2="222"/>
    <line x1="64" y1="286" x2="176" y2="286"/>
  </g>
  <g stroke="#c99a68" stroke-width="1" opacity="0.18">
    <line x1="67" y1="74" x2="173" y2="74"/>
    <line x1="66" y1="152" x2="174" y2="152"/>
    <line x1="65" y1="224" x2="175" y2="224"/>
  </g>

  <!-- center seam: the two halves that read as legs -->
  <line x1="120" y1="20" x2="120" y2="348" stroke="#1c140d" stroke-width="3"/>
  <line x1="121.5" y1="20" x2="121.5" y2="348" stroke="#c99a68" stroke-opacity="0.12" stroke-width="1"/>

  <!-- a couple of narrow accent bands, upper-right -->
  <rect x="145" y="26" width="6" height="40" fill="#1c140d" opacity="0.5"/>
  <rect x="145" y="80" width="6" height="18" fill="#1c140d" opacity="0.4"/>

  <!-- TARS, stencilled down the left half -->
  <text x="103" y="205" fill="#c1602f" font-family="ui-monospace, 'Courier New', monospace"
        font-size="16" font-weight="700" letter-spacing="4"
        transform="rotate(-90 103 205)" opacity="0.9">TARS</text>
</svg>
